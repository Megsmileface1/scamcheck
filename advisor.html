<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScamCheck Advisor</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f6fb;
      color: #0b2b50;
    }

    .header {
      background: white;
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #dbe5ef;
    }

    .header img {
      width: 220px;
      max-width: 80%;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 20px;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border: 1px solid #dbe5ef;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .placeholder {
      color: #637b94;
    }
  </style>
</head>

<body>
<div id="advisor-login" style="max-width:500px; margin:80px auto; background:white; padding:35px; border-radius:18px; text-align:center;">
  <h1>Advisor Login</h1>
  <p>Enter the ScamCheck advisor password.</p>

  <input
    type="password"
    id="advisor-password"
    placeholder="Password"
    style="width:100%; box-sizing:border-box; padding:14px; margin:15px 0; font-size:16px;"
  >

  <button
    onclick="advisorLogin()"
    style="width:100%; padding:14px; font-size:16px; cursor:pointer;"
  >
    Log In
  </button>

  <p id="login-error" style="color:#b00020;"></p>
</div>
 <div id="advisor-dashboard" style="display:none;">
  <div class="header">
    <img src="scamcheck-logo.png" alt="ScamCheck">
  </div>

  <div class="container">

    <div class="title">
      <h1>Advisor Dashboard</h1>
      <p>Customer consultation information</p>
    </div>

    <div class="card">
      <div class="label">Customer Phone Number</div>
     <div class="placeholder" id="advisor-phone">No active consultation</div>
    </div>

    <div class="card">
      <div class="label">Customer Message</div>
   <div class="placeholder" id="advisor-message">No supporting text received.</div>
    </div>

    <div class="card">
      <div class="label">Supporting Image</div>
  <div class="placeholder" id="advisor-image">No image received.</div>
    </div>

  </div>
</div>
<script>
  async function loadLatestConsultation() {
    const response = await fetch("/api/get-latest-consultation");
const result = await response.json();
    if (!response.ok || !result.consultation) {
  return;
}
    const consultation = result.consultation;
 document.getElementById("advisor-phone").textContent =
  consultation.customer_phone || "No active consultation";
    document.getElementById("advisor-message").textContent =
  consultation.customer_message || "No supporting text received.";
   const imageBox = document.getElementById("advisor-image");

if (consultation.supporting_image_signed_url) {
  imageBox.innerHTML = `<img src="${consultation.supporting_image_signed_url}" alt="Supporting information" style="max-width:100%; border-radius:10px;">`;
} else {
  imageBox.textContent = "No image received.";
}
 
 }
 let advisorRefreshTimer = null;

function showAdvisorDashboard() {
  document.getElementById("advisor-login").style.display = "none";
  document.getElementById("advisor-dashboard").style.display = "block";

  loadLatestConsultation();

  if (!advisorRefreshTimer) {
    advisorRefreshTimer = setInterval(loadLatestConsultation, 5000);
  }
}

async function checkAdvisorAuth() {
  try {
    const response = await fetch("/api/advisor-auth");

    if (response.ok) {
      showAdvisorDashboard();
    }
  } catch (error) {
    console.error("Advisor authentication check failed:", error);
  }
}

async function advisorLogin() {
  const password = document.getElementById("advisor-password").value;
  const errorBox = document.getElementById("login-error");

  errorBox.textContent = "";

  try {
    const response = await fetch("/api/advisor-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password })
    });

    if (!response.ok) {
      errorBox.textContent = "Incorrect password.";
      return;
    }

    document.getElementById("advisor-password").value = "";
    showAdvisorDashboard();
  } catch (error) {
    errorBox.textContent = "Unable to log in. Please try again.";
  }
}

checkAdvisorAuth();
  </script>
</body>
</html>
