<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScamCheck</title>

<style>
body {
    margin: 0;
    padding: 40px 20px;
    background: #f1f5f9;
    font-family: Arial, sans-serif;
    color: #0f172a;
}

.container {
    max-width: 800px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

textarea {
    width: 100%;
    min-height: 200px;
    box-sizing: border-box;
    padding: 15px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#result {
    margin-top: 20px;
    padding: 20px;
    background: #f8fafc;
    border-radius: 8px;
    line-height: 1.6;
}

.warning {
    color: #b91c1c;
}

.safe {
    color: #166534;
}
</style>
</head>

<body>

<div class="container">

<h1>ScamCheck</h1>

<div class="subtitle">
Check a suspicious email or text message for common scam warning signs.
</div>

<div class="card">

<h2>Paste your message below</h2>

<textarea id="message" placeholder="Paste the suspicious email or text message here..."></textarea>

<button onclick="checkMessage()">Check This Message</button>

<div id="result">
Your results will appear here.
</div>

</div>

</div>

<script>

function checkMessage() {

    const message = document.getElementById("message").value.trim();
    const result = document.getElementById("result");

    if (!message) {
        result.innerHTML = "Please paste a message first.";
        return;
    }

    const warningWords = [
        "urgent",
        "verify your account",
        "click here",
        "gift card",
        "send money",
        "wire transfer",
        "password",
        "social security",
        "bank account",
        "bitcoin",
        "crypto",
        "payment",
        "verification code",
        "security code"
    ];

    const lowerMessage = message.toLowerCase();

    const warnings = warningWords.filter(function(word) {
        return lowerMessage.includes(word);
    });

    if (warnings.length > 0) {

        result.innerHTML =
        '<div class="warning">' +
        '<strong>⚠️ Potential warning signs detected</strong>' +
        '<br><br>' +
        'This message contains terms commonly associated with scams:' +
        '<br><br>' +
        warnings.map(function(word) {
            return "• " + word;
        }).join("<br>") +
        '<br><br>' +
        '<strong>Be careful.</strong> Do not send money, passwords, verification codes, or personal information until you verify who contacted you.' +
        '</div>';

    } else {

        result.innerHTML =
        '<div class="safe">' +
        '<strong>No obvious scam warning words were detected.</strong>' +
        '<br><br>' +
        'That does not guarantee the message is safe. Always be cautious with unexpected requests for money or personal information.' +
        '</div>';

    }
}

</script>

</body>
</html>
