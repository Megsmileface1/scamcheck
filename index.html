<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ScamCheck</title>
  <style>
    body { background-color: #f1f5f9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
    main { background-color: white; border: 2px solid #e2e8f0; border-radius: 24px; width: 320px; padding: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .badge { background-color: #dbeafe; color: #1e40af; display: inline-block; font-weight: bold; padding: 8px 16px; border-radius: 20px; font-size: 16px; margin-bottom: 10px; }
    h1 { font-size: 28px; margin: 10px 0; color: #0f172a; }
    p { font-size: 15px; color: #475569; margin: 0 0 20px 0; }
    .red-box { background-color: #fee2e2; border: 2px solid #ef4444; border-radius: 12px; padding: 12px; margin-bottom: 20px; text-align: left; }
    .login-box { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 15px; margin-bottom: 20px; text-align: left; }
    .label { font-size: 13px; font-weight: bold; color: #475569; text-transform: uppercase; display: block; margin-bottom: 5px; }
    .input-field { width: 92%; padding: 10px; font-size: 14px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; outline: none; }
    .submit-btn { width: 100%; background-color: #2563eb; color: white; border: none; padding: 10px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .call-btn { background-color: #059669; color: white; border: 8px solid #d1fae5; border-radius: 50%; width: 160px; height: 160px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <div class="badge">🛡️ ScamCheck</div>
    <h1>Is it a Scam?</h1>
    <p>Talk to a real human expert right now.</p>
    
    <div class="red-box">
      <label class="label" style="color: #991b1b;">1. Paste Publishable Key Here:</label>
      <input type="text" class="input-field" id="supabaseKey" placeholder="sb_publishable_...">
    </div>

    <div class="login-box">
      <label class="label">2. Enter Customer Phone:</label>
      <input type="tel" class="input-field" placeholder="(555) 555-5555" id="userPhone">
      <button class="submit-btn" onclick="connectToDatabase()">Pay $10.00 & Sign Up</button>
    </div>
    
    <button class="call-btn" onclick="alert('Calling Twilio support line...')">📞 CALL NOW</button>
  </main>

  <script>
    function connectToDatabase() {
      var phone = document.getElementById('userPhone').value;
      var clientKey = document.getElementById('supabaseKey').value;
      
      if(clientKey === "") { alert("Please paste your key into the red box first!"); return; }
      if(phone === "") { alert("Please type a phone number!"); return; }

      // Native connection that requires ZERO script libraries or downloads
      var url = 'https://supabase.co';
      var xhr = new XMLHttpRequest();
      xhr.open("POST", url, true);
      
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.setRequestHeader("apikey", clientKey);
      xhr.setRequestHeader("Authorization", "Bearer " + clientKey);

      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 201 || xhr.status === 200) {
            alert("SUCCESS! Connected to your database. Phone number " + phone + " is saved!");
          } else {
            alert("Database Error Code " + xhr.status + ": " + xhr.responseText);
          }
        }
      };

      var data = JSON.stringify({
        "phone_number": phone,
        "call_credits": 1,
        "account_status": "active"
      });

      xhr.send(data);
    }
  </script>
</body>
</html>
